# Production stack: the relay on a fixed host port (default 7410, from the 7000-8000 range).
#   1. fill in .env
#   2. docker compose up -d --build         -> http://<host>:${UC_PORT}
# Point your own HTTPS reverse proxy / tunnel for uclip.gaiasentinel.online at that port.
# HTTPS is required for the web app, Google sign-in and the installers. To let this stack
# terminate HTTPS itself instead (ports 80/443 + automatic certificates):
#   docker compose --profile https up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UC_PUBLIC_URL: https://${UC_DOMAIN:-uclip.gaiasentinel.online}
    volumes:
      - uclip-data:/data
    ports:
      # UC_BIND=127.0.0.1 if your reverse proxy runs on this same machine
      - '${UC_BIND:-0.0.0.0}:${UC_PORT:-7410}:8787'
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      UC_DOMAIN: ${UC_DOMAIN:-uclip.gaiasentinel.online}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  uclip-data:
  caddy-data:
  caddy-config:
